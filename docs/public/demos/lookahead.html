<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>未来函数交互演示 · AI 量化橙皮书</title>
<style>
  :root { --orange:#F97316; --ink:#1c2430; --muted:#6b7280; --grid:#e5e7eb; --red:#dc2626; --green:#16a34a; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; background:#fffdfa; color:var(--ink); padding:20px 22px 16px; }
  header { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; margin-bottom:6px; }
  h1 { font-size:17px; }
  h1 .tag { display:inline-block; margin-left:8px; font-size:11px; font-weight:700; color:var(--orange); background:rgba(249,115,22,.12); border:1px solid rgba(249,115,22,.4); padding:2px 10px; border-radius:999px; vertical-align:2px;}
  .desc { font-size:13px; color:var(--muted); line-height:1.75; margin-bottom:12px; }
  .desc b.cheat { color:var(--red); } .desc b.honest { color:var(--green); }
  .switch { display:flex; align-items:center; gap:10px; background:#fff; border:1px solid var(--grid); border-radius:999px; padding:8px 14px; font-size:13px; font-weight:700; cursor:pointer; user-select:none; width:fit-content; margin-bottom:12px;}
  .switch .track { width:44px; height:24px; border-radius:999px; background:#d1d5db; position:relative; transition:.2s; }
  .switch .knob { position:absolute; top:3px; left:3px; width:18px; height:18px; border-radius:50%; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.25); transition:.2s; }
  .switch.on .track { background:var(--red); }
  .switch.on .knob { left:23px; }
  .switch.on .st { color:var(--red); }
  .st { color:var(--green); }
  canvas { width:100%; height:210px; display:block; background:#fff; border:1px solid var(--grid); border-radius:10px; }
  .lbl { font-size:12px; color:var(--muted); margin:4px 2px 12px; }
  .verdict { border-radius:10px; padding:12px 16px; font-size:13.5px; line-height:1.8; margin-top:2px; }
  .verdict.bad { background:rgba(220,38,38,.07); border:1px solid rgba(220,38,38,.4); }
  .verdict.good { background:rgba(22,163,74,.07); border:1px solid rgba(22,163,74,.4); }
  .verdict b { font-size:14px; }
  .legend { display:flex; gap:16px; flex-wrap:wrap; font-size:12px; color:var(--muted); margin-bottom:8px; }
  .legend i { display:inline-block; width:18px; height:3px; border-radius:2px; margin-right:5px; vertical-align:3px; }
</style>
</head>
<body>
<header>
  <h1>未来函数演示：信号「偷看」了当日收盘价会怎样<span class="tag">交互演示</span></h1>
</header>
<p class="desc">
  策略规则：收盘价上穿 MA20 → 买入。唯一的区别——<br>
  <b class="honest">诚实模式</b>：用<b>昨天</b>的均线状态决定<b>今天</b>的动作（实盘做得到）；<br>
  <b class="cheat">作弊模式</b>：用<b>今天收盘后</b>才知道的均线状态决定<b>今天</b>的动作（实盘做不到，只有回测里"做得到"）。
</p>
<div class="switch on" id="sw"><div class="track"><div class="knob"></div></div><span class="st" id="swLbl">作弊模式：偷看当日收盘价（未来函数）</span></div>
<div class="legend">
  <span><i style="background:#94a3b8"></i>价格</span>
  <span><i style="background:#2563eb"></i>MA20</span>
  <span><i style="background:var(--green)">▲</i> 买入信号</span>
  <span><i style="background:var(--red)">▼</i> 卖出信号</span>
  <span>🎲 换行情按钮在下面</span>
</div>
<canvas id="cv" height="210"></canvas>
<div class="lbl">策略信号与净值（模拟日线）</div>
<div class="verdict bad" id="verdict"></div>
<div style="margin-top:12px"><button class="switch" id="reroll" style="border-color:var(--orange);color:var(--orange);background:#fff">🎲 换一段行情再对比</button></div>

<script>
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
var N=200, seed=88880001, cheat=true;
function gen(s){var r=mulberry32(s),p=100,a=[],tr=0.0003;for(var i=0;i<N;i++){if(i%55===0)tr=(r()-0.45)*0.005;p=p*(1+tr+(r()-0.5)*0.022);a.push(p);}return a;}
function ma(a,n){var o=[];for(var i=0;i<a.length;i++){if(i<n-1){o.push(null);continue}var s=0;for(var j=i-n+1;j<=i;j++)s+=a[j];o.push(s/n);}return o;}

function sim(price, useCheat){
  var m = ma(price,20), pos=false, eq=[100], marks=[], peekGone=0, prevSig=false;
  for(var i=20;i<N;i++){
    // 信号：今天应不应该持有？诚实=用 i-1 收盘后的状态；作弊=用 i 收盘后的状态（当日不可知）
    var idx = useCheat ? i : i-1;
    var sig = m[idx]!==null && price[idx]>m[idx];
    // 统计"信号漂移"：诚实模式下，当天盘中以为有信号、收盘后消失的次数（作弊回测看不到）
    if(useCheat){
      var sigHonest = m[i-1]!==null && price[i-1]>m[i-1];
      if(sig!==sigHonest) peekGone++;
    }
    if(sig && !pos){ pos=true; marks.push({i:i,v:price[i],dir:1}); }
    if(!sig && pos){ pos=false; marks.push({i:i,v:price[i],dir:-1}); }
    var nav=eq[eq.length-1]; if(pos) nav*=price[i]/price[i-1]; eq.push(nav);
  }
  return {eq:eq, marks:marks, peekGone:peekGone};
}

function draw(price, res){
  var cv=document.getElementById('cv'), dpr=window.devicePixelRatio||1, w=cv.clientWidth, h=cv.height;
  cv.width=w*dpr; cv.style.height=h+'px';
  var ctx=cv.getContext('2d'); ctx.scale(dpr,dpr); ctx.clearRect(0,0,w,h);
  var m=ma(price,20);
  var all=price.concat(m.filter(function(v){return v!==null})).concat(res.eq);
  var min=Math.min.apply(null,all),max=Math.max.apply(null,all),pad=(max-min)*.08;min-=pad;max+=pad;
  function X(i){return i/(N-1)*(w-16)+8}
  function Y(v){return h-14-(v-min)/(max-min)*(h-28)}
  function line(vals,color,wd){ctx.strokeStyle=color;ctx.lineWidth=wd;ctx.beginPath();var st=false;vals.forEach(function(v,i){if(v===null)return;if(!st){ctx.moveTo(X(i),Y(v));st=true}else ctx.lineTo(X(i),Y(v))});ctx.stroke();}
  ctx.strokeStyle='#f3f4f6';for(var g=1;g<4;g++){ctx.beginPath();ctx.moveTo(8,h*g/4);ctx.lineTo(w-8,h*g/4);ctx.stroke();}
  // 净值（右轴归一化到价格区间下半段）
  var eqScaled=res.eq.map(function(v){return min+(v-97)/6*(max-min)*0.55});
  line(price,'#94a3b8',1.4); line(m,'#2563eb',1.8);
  ctx.save(); ctx.setLineDash([4,4]); line(eqScaled,cheat?'#dc2626':'#16a34a',1.8); ctx.restore();
  res.marks.forEach(function(k){
    ctx.fillStyle=k.dir>0?'#16a34a':'#dc2626'; ctx.beginPath();
    var y=Y(k.v)+(k.dir>0?-10:10);
    ctx.moveTo(X(k.i),y);ctx.lineTo(X(k.i)-6,y+(k.dir>0?9:-9));ctx.lineTo(X(k.i)+6,y+(k.dir>0?9:-9));ctx.closePath();ctx.fill();
  });
}

function render(){
  var price=gen(seed);
  var res=sim(price,cheat);
  draw(price,res);
  var v=document.getElementById('verdict');
  if(cheat){
    v.className='verdict bad';
    v.innerHTML='<b>🚨 这就是未来函数。</b>回测里信号精准得像仙钱，净值（红虚线）一路起飞——但这些信号用了<b>当天收盘后才知道的数据</b>。实盘中你根本拿不到，信号会在盘中出现、收盘后消失。本段行情里有 <b>'+res.peekGone+' 天</b>信号在"出现/消失"之间反复横跳。';
  }else{
    v.className='verdict good';
    v.innerHTML='<b>✅ 这是诚实回测。</b>所有信号只用昨天收盘后的状态决定今天的动作——实盘完全可以复现。净值（绿虚线）不再神奇，但它才是这个策略<b>真实能拿到的样子</b>。记住这条铁律：<b>算信号的每一根数据，都必须是决策时刻已经发生的。</b>';
  }
}
document.getElementById('sw').onclick=function(){cheat=!cheat;this.classList.toggle('on',cheat);document.getElementById('swLbl').textContent=cheat?'作弊模式：偷看当日收盘价（未来函数）':'诚实模式：只用昨日收盘后的状态';document.getElementById('swLbl').className='st';render();};
document.getElementById('reroll').onclick=function(){seed=Math.floor(Math.random()*1e8);render();};
window.addEventListener('resize',render);
render();
</script>
</body>
</html>
